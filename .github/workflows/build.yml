          package com.example.simplecamera

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.util.AttributeSet
          import android.view.View

          /** Вертикальный ползунок яркости (солнышко) рядом с кольцом фокуса. */
          class ExposureSliderView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs) {

              /** 0 = темнее всего, 1 = ярче всего. */
              var fraction: Float = 0.5f
                  set(value) {
                      field = value.coerceIn(0f, 1f)
                      invalidate()
                  }

              private val d = resources.displayMetrics.density

              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.argb(200, 255, 212, 0)
                  strokeWidth = 1.5f * d
                  strokeCap = Paint.Cap.ROUND
              }

              private val sunPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.rgb(255, 212, 0)
                  strokeWidth = 1.5f * d
                  strokeCap = Paint.Cap.ROUND
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val cx = width / 2f
                  val r = 8f * d
                  val top = r + 2f * d
                  val bottom = height - r - 2f * d
                  canvas.drawLine(cx, top, cx, bottom, linePaint)

                  val cy = bottom - (bottom - top) * fraction
                  canvas.drawCircle(cx, cy, r * 0.5f, sunPaint)
                  for (i in 0 until 8) {
                      val a = Math.PI / 4.0 * i
                      val c = Math.cos(a).toFloat()
                      val s = Math.sin(a).toFloat()
                      canvas.drawLine(
                          cx + c * r * 0.75f, cy + s * r * 0.75f,
                          cx + c * r * 1.0f, cy + s * r * 1.0f,
                          sunPaint
                      )
                  }
              }
          }
