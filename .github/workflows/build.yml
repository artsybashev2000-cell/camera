              // ---------------------------------------------------------------- permissions

              private fun allPermissionsGranted(): Boolean = neededPermissions.all {
                  ContextCompat.checkSelfPermission(this, it) == PackageManager.PERMISSION_GRANTED
              }

              private fun hasAudioPermission(): Boolean =
                  ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) ==
                      PackageManager.PERMISSION_GRANTED

              // ---------------------------------------------------------------- camera selection / lenses

              private fun sameId(info: CameraInfo, id: String): Boolean =
                  try {
                      Camera2CameraInfo.from(info).cameraId == id
                  } catch (e: Exception) {
                      false
                  }

              /** Селектор по стороне камеры; для задней можно выбрать конкретный объектив по Camera2-id. */
              private fun baseSelector(facing: Int, lensId: String? = null): CameraSelector {
                  val b = CameraSelector.Builder().requireLensFacing(facing)
                  if (lensId != null && facing == CameraSelector.LENS_FACING_BACK) {
                      b.addCameraFilter(CameraFilter { infos -> infos.filter { sameId(it, lensId) } })
                  }
                  return b.build()
              }

              private fun hasLens(provider: ProcessCameraProvider, facing: Int): Boolean =
                  try {
                      provider.hasCamera(baseSelector(facing))
                  } catch (e: Exception) {
                      false
                  }

              /** Ищем у задней камеры ультраширик и телевик по эквивалентному фокусному. */
              private fun scanLenses(provider: ProcessCameraProvider) {
                  ultraLens = null
                  teleLens = null
                  mainBackId = null
                  try {
                      val back = baseSelector(CameraSelector.LENS_FACING_BACK)
                          .filter(provider.availableCameraInfos)
                      val lenses = back.mapNotNull { info ->
                          try {
                              val c2 = Camera2CameraInfo.from(info)
                              val focal = c2.getCameraCharacteristic(
                                  CameraCharacteristics.LENS_INFO_AVAILABLE_FOCAL_LENGTHS
                              )?.minOrNull() ?: 0f
                              val size = c2.getCameraCharacteristic(
                                  CameraCharacteristics.SENSOR_INFO_PHYSICAL_SIZE
                              )
                              val pix = c2.getCameraCharacteristic(
                                  CameraCharacteristics.SENSOR_INFO_PIXEL_ARRAY_SIZE
                              )
                              if (size == null || pix == null || focal <= 0f) {
                                  null
                              } else {
                                  val diag = Math.sqrt(
                                      (size.width * size.width + size.height * size.height).toDouble()
                                  ).toFloat()
                                  Lens(c2.cameraId, focal * 43.27f / diag, pix.width * pix.height / 1e6f)
                              }
                          } catch (e: Exception) {
                              null
                          }
                      }
                      val usable = lenses.filter { it.mp >= 4f }
                      val main = usable.firstOrNull() ?: return
                      mainBackId = main.id
                      val others = usable.filter { it.id != main.id }
                      others.forEach { it.factor = it.equiv / main.equiv }

                      ultraLens = others.filter { it.factor < 0.85f }.minByOrNull { it.factor }
                          ?.also { it.factor = Math.round(it.factor * 10f) / 10f }
                      teleLens = others.filter { it.factor > 1.6f }.minByOrNull { it.factor }
                          ?.also { it.factor = Math.round(it.factor * 2f) / 2f }
                  } catch (e: Exception) {
                      // диагностика всё равно покажет, что есть в системе
                  }
              }

              private fun startCamera() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      val provider = future.get()
                      cameraProvider = provider
                      if (!hasLens(provider, lensFacing)) {
                          lensFacing = CameraSelector.LENS_FACING_FRONT
                      }
                      scanLenses(provider)

                      val extFuture = try {
                          ExtensionsManager.getInstanceAsync(this, provider)
                      } catch (e: Exception) {
                          null
                      }
                      if (extFuture == null) {
                          bindCamera()
                      } else {
                          extFuture.addListener({
                              extManager = try {
                                  extFuture.get()
                              } catch (e: Exception) {
                                  null
                              }
                              bindCamera()
                          }, ContextCompat.getMainExecutor(this))
                      }
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun fpsRange60(info: CameraInfo?): Range<Int>? =
                  try {
                      if (info == null) {
                          null
                      } else {
                          Camera2CameraInfo.from(info)
                              .getCameraCharacteristic(CameraCharacteristics.CONTROL_AE_AVAILABLE_TARGET_FPS_RANGES)
                              ?.filter { it.upper == 60 }
                              ?.maxByOrNull { it.lower }
                      }
                  } catch (e: Exception) {
                      null
                  }

              private fun stabilizationOk(info: CameraInfo?): Boolean =
                  try {
                      if (info == null) {
                          false
                      } else {
                          Camera2CameraInfo.from(info)
                              .getCameraCharacteristic(CameraCharacteristics.CONTROL_AVAILABLE_VIDEO_STABILIZATION_MODES)
                              ?.contains(CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE_ON) == true
                      }
                  } catch (e: Exception) {
                      false
                  }

              /** Приводим «эффективный» режим кадра: в видео только 16:9 или FULL. */
              private fun effRatioIndex(): Int =
                  if (videoMode) (if (ratioIndex == RATIO_FULL) RATIO_FULL else 1) else ratioIndex

              private fun bindCamera(allowExt: Boolean = true) {
                  val provider = cameraProvider ?: return

                  // ViewPort нужен, чтобы фото/видео совпадали с тем, что видно на экране.
                  val viewPort = binding.viewFinder.viewPort
                  if (viewPort == null && bindRetries < 10) {
                      bindRetries++
                      binding.viewFinder.postDelayed({ bindCamera(allowExt) }, 50)
                      return
                  }
                  bindRetries = 0

                  val front = lensFacing == CameraSelector.LENS_FACING_FRONT
                  if (front) activeBackId = null
                  val base = baseSelector(lensFacing, activeBackId)
                  val info: CameraInfo? = try {
                      base.filter(provider.availableCameraInfos).firstOrNull()
                  } catch (e: Exception) {
                      null
                  }

                  // HDR / ночной режим через расширения (если телефон их отдаёт)
                  val mgr = extManager
                  extAvailable = if (!videoMode && mgr != null) {
                      listOf(ExtensionMode.HDR, ExtensionMode.NIGHT).filter {
                          try {
                              mgr.isExtensionAvailable(base, it)
                          } catch (e: Exception) {
                              false
                          }
                      }
                  } else {
                      emptyList()
                  }
                  val effExt = if (allowExt && extMode in extAvailable) extMode else ExtensionMode.NONE
                  val selector = try {
                      if (effExt != ExtensionMode.NONE) {
                          mgr?.getExtensionEnabledCameraSelector(base, effExt) ?: base
                      } else {
                          base
                      }
                  } catch (e: Exception) {
                      base
                  }
                  updateExtUi(effExt)

                  val ri = effRatioIndex()
                  val strategy = if (ri == 1 || ri == RATIO_FULL) {
                      AspectRatioStrategy.RATIO_16_9_FALLBACK_AUTO_STRATEGY
                  } else {
                      AspectRatioStrategy.RATIO_4_3_FALLBACK_AUTO_STRATEGY
                  }

                  val previewBuilder = Preview.Builder()
                      .setResolutionSelector(
                          ResolutionSelector.Builder().setAspectRatioStrategy(strategy).build()
                      )

                  fps60Supported = fpsRange60(info) != null
                  if (videoMode) {
                      // 60 fps и стабилизация через Camera2
                      try {
                          val ext = Camera2Interop.Extender(previewBuilder)
                          val range = if (fps60) fpsRange60(info) else null
                          if (range != null) {
                              ext.setCaptureRequestOption(CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE, range)
                          }
                          if (stabilizationOk(info)) {
                              ext.setCaptureRequestOption(
                                  CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE,
                                  CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE_ON
                              )
                          }
                      } catch (e: Exception) {
                          // без интеропа просто пишем как обычно
                      }
                  }

                  val preview = previewBuilder.build()
                  preview.setSurfaceProvider(binding.viewFinder.surfaceProvider)

                  val group = UseCaseGroup.Builder().addUseCase(preview)
                  if (viewPort != null) group.setViewPort(viewPort)

                  imageCapture = null
                  videoCapture = null
                  if (videoMode) {
                      val recorder = Recorder.Builder()
                          .setQualitySelector(
                              QualitySelector.from(
                                  videoQuality,
                                  FallbackStrategy.lowerQualityOrHigherThan(videoQuality)
                              )
                          )
                          .build()
                      val vc = VideoCapture.Builder(recorder)
                          .setMirrorMode(
                              if (front && mirrorSelfie) MirrorMode.MIRROR_MODE_ON_FRONT_ONLY
                              else MirrorMode.MIRROR_MODE_OFF
                          )
                          .setTargetRotation(shotRotation)
                          .build()
                      videoCapture = vc
                      group.addUseCase(vc)
                  } else {
                      val capture = ImageCapture.Builder()
                          .setCaptureMode(ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY)
                          .setResolutionSelector(
                              ResolutionSelector.Builder()
                                  .setAspectRatioStrategy(strategy)
                                  .setResolutionStrategy(ResolutionStrategy.HIGHEST_AVAILABLE_STRATEGY)
                                  .build()
                          )
                          .setTargetRotation(shotRotation)
                          .build()
                      imageCapture = capture
                      group.addUseCase(capture)
                  }

                  // если зеркало выключено, превью переворачиваем, чтобы оно показывало то, что сохранится
                  binding.viewFinder.scaleX = if (front && !mirrorSelfie) -1f else 1f

                  try {
                      provider.unbindAll()
                      val cam = provider.bindToLifecycle(this, selector, group.build())
                      camera = cam
                      exposureIndex = 0
                      exposureAccum = 0f
                      aeLocked = false
                      uiHandler.removeCallbacks(hideFocusUi)
                      binding.focusRing.visibility = View.GONE
                      binding.exposureSlider.visibility = View.GONE

                      if (activeBackId == null) {
                          cam.cameraInfo.zoomState.value?.let {
                              mainZoomMin = it.minZoomRatio
                              mainZoomMax = it.maxZoomRatio
                          }
                      }

                      zoomLive?.removeObserver(zoomObserver)
                      zoomLive = cam.cameraInfo.zoomState
                      zoomLive?.observe(this, zoomObserver)

                      pendingZoom?.let { z ->
                          val zs = cam.cameraInfo.zoomState.value
                          val target = if (zs != null) z.coerceIn(zs.minZoomRatio, zs.maxZoomRatio) else z
                          cam.cameraControl.setZoomRatio(target)
                      }
                      pendingZoom = null

                      buildZoomChips()
                      applyFlash()
                      updateFlashUi()
                      updateTopBarUi()
                  } catch (e: Exception) {
                      pendingZoom = null
                      if (effExt != ExtensionMode.NONE && allowExt) {
                          extMode = ExtensionMode.NONE
                          saveSettings()
                          toast("Этот режим не поддерживается")
                          bindCamera(false)
                      } else if (activeBackId != null) {
                          activeBackId = null
                          toast("Этот объектив приложению недоступен")
                          bindCamera(false)
                      } else {
                          Toast.makeText(this, "Не удалось запустить камеру", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              private fun switchCamera() {
                  if (recording != null) return
                  val provider = cameraProvider ?: return
                  val newFacing = if (lensFacing == CameraSelector.LENS_FACING_BACK) {
                      CameraSelector.LENS_FACING_FRONT
                  } else {
                      CameraSelector.LENS_FACING_BACK
                  }
                  if (hasLens(provider, newFacing)) {
                      lensFacing = newFacing
                      activeBackId = null
                      bindCamera()
                  } else {
                      toast("Другой камеры нет")
                  }
              }

              // ---------------------------------------------------------------- top bar state

              private fun qualityLabel(q: Quality): String = when (q) {
                  Quality.UHD -> "4K"
                  Quality.FHD -> "FHD"
                  Quality.HD -> "HD"
                  else -> "SD"
              }

              private fun updateTopBarUi() {
                  val front = lensFacing == CameraSelector.LENS_FACING_FRONT
                  binding.btnMirror.visibility = if (front) View.VISIBLE else View.GONE
                  binding.btnMirror.setColorFilter(if (mirrorSelfie) yellow else Color.WHITE)
                  binding.tvExt.visibility =
                      if (!videoMode && extAvailable.isNotEmpty()) View.VISIBLE else View.GONE
                  binding.tvFps.visibility =
                      if (videoMode && fps60Supported) View.VISIBLE else View.GONE
                  binding.tvFps.text = if (fps60) "60fps" else "30fps"
                  binding.tvFps.setTextColor(if (fps60) yellow else Color.WHITE)
                  binding.tvRatio.text =
                      if (videoMode) qualityLabel(videoQuality) else ratioLabels[ratioIndex]
              }

              private fun updateExtUi(eff: Int) {
                  binding.tvExt.text = when {
                      eff == ExtensionMode.NIGHT -> "НОЧЬ"
                      eff == ExtensionMode.HDR -> "HDR"
                      extAvailable.isEmpty() || ExtensionMode.HDR in extAvailable -> "HDR"
                      else -> "НОЧЬ"
                  }
                  binding.tvExt.setTextColor(if (eff != ExtensionMode.NONE) yellow else Color.WHITE)
              }

              private fun cycleExt() {
                  if (recording != null || videoMode) return
                  if (extAvailable.isEmpty()) {
                      toast("Недоступно на этом телефоне")
                      return
                  }
                  val order = listOf(ExtensionMode.NONE) + extAvailable
                  val cur = order.indexOf(if (extMode in extAvailable) extMode else ExtensionMode.NONE)
                  extMode = order[(cur + 1) % order.size]
                  saveSettings()
                  showHud(
                      when (extMode) {
                          ExtensionMode.HDR -> "HDR включён"
                          ExtensionMode.NIGHT -> "Ночной режим включён"
                          else -> "HDR / ночной режим выключен"
                      }
                  )
                  bindCamera()
              }

              private fun toggleMirror() {
                  if (recording != null) return
                  mirrorSelfie = !mirrorSelfie
                  saveSettings()
                  showHud(if (mirrorSelfie) "Зеркало вкл: как в превью" else "Зеркало выкл: как видит камера")
                  bindCamera()
              }

              // ---------------------------------------------------------------- aspect ratio

              private fun cycleRatio() {
                  if (recording != null) return
                  ratioIndex = (ratioIndex + 1) % ratioLabels.size
                  saveSettings()
                  applyRatio(true)
              }

              private fun applyRatio(rebind: Boolean) {
                  val lp = binding.viewFinder.layoutParams as ConstraintLayout.LayoutParams
                  lp.dimensionRatio = when (effRatioIndex()) {
                      0 -> "H,3:4"
                      1 -> "H,9:16"
                      2 -> "H,1:1"
                      else -> null
                  }
                  binding.viewFinder.layoutParams = lp
                  updateTopBarUi()
                  if (rebind) {
                      binding.viewFinder.doOnNextLayout { bindCamera() }
                  }
              }

              // ---------------------------------------------------------------- flash

              private fun cycleFlash() {
                  val cam = camera
                  if (cam == null) return
                  val hasUnit = cam.cameraInfo.hasFlashUnit()
                  val front = lensFacing == CameraSelector.LENS_FACING_FRONT

                  if (!hasUnit) {
                      if (front && !videoMode) {
                          // у фронталки нет вспышки: подсвечиваем экраном
                          flash = if (flash == FLASH_ON) FLASH_OFF else FLASH_ON
                          saveSettings()
                          updateFlashUi()
                          showHud(if (flash == FLASH_ON) "Экранная вспышка: вкл" else "Вспышка выкл")
                      } else {
                          toast("У этой камеры нет вспышки")
                      }
                      return
                  }

                  flash = if (videoMode) {
                      if (flash == FLASH_TORCH) FLASH_OFF else FLASH_TORCH
                  } else {
                      (flash + 1) % 4
                  }
                  applyFlash()
                  updateFlashUi()
                  saveSettings()
                  showHud(
                      when (flash) {
                          FLASH_AUTO -> "Вспышка: авто"
                          FLASH_ON -> "Вспышка: вкл"
                          FLASH_TORCH -> "Фонарик"
                          else -> "Вспышка выкл"
                      }
                  )
              }

              private fun applyFlash() {
                  val cam = camera ?: return
                  if (!cam.cameraInfo.hasFlashUnit()) return
                  imageCapture?.flashMode = when (flash) {
                      FLASH_ON -> ImageCapture.FLASH_MODE_ON
                      FLASH_AUTO -> ImageCapture.FLASH_MODE_AUTO
                      else -> ImageCapture.FLASH_MODE_OFF
                  }
                  cam.cameraControl.enableTorch(flash == FLASH_TORCH)
              }

              private fun updateFlashUi() {
                  val hasUnit = camera?.cameraInfo?.hasFlashUnit() ?: false
                  val screenFlashPossible =
                      lensFacing == CameraSelector.LENS_FACING_FRONT && !videoMode
                  binding.btnFlash.setImageResource(
                      when (flash) {
                          FLASH_AUTO -> R.drawable.ic_flash_auto
                          FLASH_ON -> R.drawable.ic_flash_on
                          FLASH_TORCH -> R.drawable.ic_flash_torch
                          else -> R.drawable.ic_flash_off
                      }
                  )
                  binding.btnFlash.setColorFilter(if (flash == FLASH_OFF) Color.WHITE else yellow)
                  binding.btnFlash.alpha = if (hasUnit || screenFlashPossible) 1f else 0.35f
              }

              private fun screenFlashWanted(): Boolean =
                  lensFacing == CameraSelector.LENS_FACING_FRONT &&
                      camera?.cameraInfo?.hasFlashUnit() != true &&
                      flash == FLASH_ON

              private fun showScreenFlash(on: Boolean) {
                  binding.screenFlash.visibility = if (on) View.VISIBLE else View.GONE
                  val lp = window.attributes
                  lp.screenBrightness =
                      if (on) 1f else WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE
                  window.attributes = lp
              }

              // ---------------------------------------------------------------- zoom chips

              private fun fmtZoom(v: Float): String =
                  if (Math.abs(v - Math.round(v)) < 0.05f) {
                      "${Math.round(v)}"
                  } else {
                      String.format(Locale.US, "%.1f", v)
                  }

              private fun lensBase(): Float {
                  if (lensFacing != CameraSelector.LENS_FACING_BACK) return 1f
                  val id = activeBackId ?: return 1f
                  return ultraLens?.takeIf { it.id == id }?.factor
                      ?: teleLens?.takeIf { it.id == id }?.factor
                      ?: 1f
              }

              private fun buildZoomChips() {
                  zoomChips.clear()
                  val back = lensFacing == CameraSelector.LENS_FACING_BACK
                  val ultra = if (back) ultraLens else null
                  val tele = if (back) teleLens else null

                  if (mainZoomMin < 0.95f) {
                      // ширик уже внутри логической камеры, достаточно zoomRatio < 1
                      zoomChips.add(ZoomChip(mainZoomMin, null, mainZoomMin))
                  } else if (ultra != null) {
                      zoomChips.add(ZoomChip(ultra.factor, ultra.id, 1f))
                  }
                  zoomChips.add(ZoomChip(1f, null, 1f))
                  if (mainZoomMax >= 2f && (tele == null || tele.factor > 2.5f)) {
                      zoomChips.add(ZoomChip(2f, null, 2f))
                  }
                  if (tele != null) {
                      zoomChips.add(ZoomChip(tele.factor, tele.id, 1f))
                  } else if (mainZoomMax >= 5f) {
                      zoomChips.add(ZoomChip(5f, null, 5f))
                  }
                  zoomChips.sortBy { it.effective }

                  binding.zoomRow.removeAllViews()
                  for (c in zoomChips) {
                      val tv = TextView(this).apply {
                          gravity = Gravity.CENTER
                          minWidth = dp(40).toInt()
                          setPadding(dp(8).toInt(), 0, dp(8).toInt(), 0)
                          textSize = 13f
                          setTypeface(typeface, Typeface.BOLD)
                          setOnClickListener { onChipClick(c) }
                          setOnLongClickListener {
                              showCameraInfo()
                              true
                          }
                      }
                      binding.zoomRow.addView(
                          tv,
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT,
                              dp(32).toInt()
                          )
                      )
                  }
                  updateZoomUi(lensBase() * (camera?.cameraInfo?.zoomState?.value?.zoomRatio ?: 1f))
              }

              private fun updateZoomUi(effective: Float) {
                  if (zoomChips.isEmpty()) return
                  var idx = 0
                  zoomChips.forEachIndexed { i, c -> if (c.effective <= effective + 0.05f) idx = i }
                  for (i in 0 until binding.zoomRow.childCount) {
                      if (i >= zoomChips.size) break
                      val tv = binding.zoomRow.getChildAt(i) as TextView
                      val c = zoomChips[i]
                      if (i == idx) {
                          val shown = if (Math.abs(effective - c.effective) < 0.05f) c.effective else effective
                          tv.text = fmtZoom(shown) + "x"
                          tv.setTextColor(yellow)
                          tv.setBackgroundResource(R.drawable.chip_sel_bg)
                      } else {
                          tv.text = fmtZoom(c.effective)
                          tv.setTextColor(Color.WHITE)
                          tv.background = null
                      }
                  }
              }

              private fun onChipClick(c: ZoomChip) {
                  if (lensFacing == CameraSelector.LENS_FACING_BACK && c.lens != activeBackId) {
                      if (recording != null) {
                          toast("Во время записи объектив менять нельзя")
                          return
                      }
                      activeBackId = c.lens
                      pendingZoom = c.zoom
                      bindCamera()
                  } else {
                      val cam = camera ?: return
                      val zs = cam.cameraInfo.zoomState.value
                      val target = if (zs != null) c.zoom.coerceIn(zs.minZoomRatio, zs.maxZoomRatio) else c.zoom
                      cam.cameraControl.setZoomRatio(target)
                  }
              }

              // ---------------------------------------------------------------- camera diagnostics

              private fun cameraReport(): String {
                  val sb = StringBuilder()
                  sb.append(Build.MANUFACTURER).append(' ').append(Build.MODEL)
                      .append(", Android ").append(Build.VERSION.RELEASE)
                      .append(" (API ").append(Build.VERSION.SDK_INT).append(")\n\n")

                  sb.append("Что выбрало приложение:\n")
                  sb.append("• основная задняя: ").append(mainBackId ?: "не найдена").append('\n')
                  val u = ultraLens
                  sb.append("• ультраширик: ")
                      .append(if (u != null) "id ${u.id}, ×${fmtZoom(u.factor)}" else "отдельной камерой не виден")
                      .append('\n')
                  val t = teleLens
                  sb.append("• телевик: ")
                      .append(if (t != null) "id ${t.id}, ×${fmtZoom(t.factor)}" else "отдельной камерой не виден")
                      .append('\n')
                  sb.append("• зум основной: ")
                      .append(String.format(Locale.US, "%.2f–%.2f", mainZoomMin, mainZoomMax))
                      .append('\n')

                  val seen = try {
                      cameraProvider?.availableCameraInfos
                          ?.mapNotNull {
                              try {
                                  Camera2CameraInfo.from(it).cameraId
                              } catch (e: Exception) {
                                  null
                              }
                          }
                          ?.joinToString(", ")
                  } catch (e: Exception) {
                      null
                  }
                  sb.append("• видит CameraX: ").append(seen ?: "?").append("\n\n")

                  sb.append("Все камеры в системе (Camera2):\n")
                  try {
                      val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      for (id in cm.cameraIdList) {
                          val ch = cm.getCameraCharacteristics(id)
                          val facing = when (ch.get(CameraCharacteristics.LENS_FACING)) {
                              CameraCharacteristics.LENS_FACING_BACK -> "задняя"
                              CameraCharacteristics.LENS_FACING_FRONT -> "фронтальная"
                              else -> "внешняя"
                          }
                          val focal = ch.get(CameraCharacteristics.LENS_INFO_AVAILABLE_FOCAL_LENGTHS)
                              ?.joinToString("/") ?: "?"
                          sb.append("• id ").append(id).append(": ").append(facing)
                              .append(", f=").append(focal).append(" мм")
                          val pix = ch.get(CameraCharacteristics.SENSOR_INFO_PIXEL_ARRAY_SIZE)
                          if (pix != null) {
                              sb.append(", ")
                                  .append(String.format(Locale.US, "%.0f МП", pix.width * pix.height / 1e6f))
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                              val z = ch.get(CameraCharacteristics.CONTROL_ZOOM_RATIO_RANGE)
                              if (z != null) sb.append(", зум ${z.lower}–${z.upper}")
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                              val ph = ch.physicalCameraIds
                              if (ph.isNotEmpty()) sb.append(", физ. камеры: ").append(ph.joinToString(","))
                          }
                          sb.append('\n')
                      }
                  } catch (e: Exception) {
                      sb.append("не удалось прочитать\n")
                  }
                  return sb.toString()
              }

              private fun showCameraInfo() {
                  val text = cameraReport()
                  AlertDialog.Builder(this)
                      .setTitle("Камеры")
                      .setMessage(text)
                      .setPositiveButton("Копировать") { _, _ ->
                          val clip = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          clip.setPrimaryClip(ClipData.newPlainText("cameras", text))
                          toast("Скопировано")
                      }
                      .setNegativeButton("Закрыть", null)
                      .show()
              }

              // ---------------------------------------------------------------- focus / exposure

              private fun focusAt(x: Float, y: Float, lock: Boolean) {
                  val cam = camera ?: return
                  val point = binding.viewFinder.meteringPointFactory.createPoint(x, y)
                  val builder = FocusMeteringAction.Builder(
                      point,
                      FocusMeteringAction.FLAG_AF or FocusMeteringAction.FLAG_AE
                  )
                  if (lock) {
                      builder.disableAutoCancel()
                  } else {
                      builder.setAutoCancelDuration(4, TimeUnit.SECONDS)
                  }
                  cam.cameraControl.startFocusAndMetering(builder.build())
                  aeLocked = lock
                  lastFocusTime = SystemClock.uptimeMillis()
                  showFocusUi(x, y)
                  if (lock) showHud("AE/AF зафиксированы")
              }

              private fun showFocusUi(x: Float, y: Float) {
                  val vf = binding.viewFinder
                  val px = if (vf.scaleX < 0) vf.width - x else x
                  val ring = binding.focusRing
                  val slider = binding.exposureSlider
                  ring.animate().cancel()
                  slider.animate().cancel()

                  val half = dp(36)
                  ring.translationX = vf.left + px - half
                  ring.translationY = vf.top + y - half
                  ring.visibility = View.VISIBLE
                  ring.alpha = 1f
                  ring.scaleX = 1.4f
                  ring.scaleY = 1.4f
                  ring.animate().setStartDelay(0).scaleX(1f).scaleY(1f).setDuration(200).start()

                  val sw = dp(28)
                  val sh = dp(120)
                  val sx = if (px + half + sw + dp(8) > vf.width) {
                      px - half - dp(8) - sw
                  } else {
                      px + half + dp(8)
                  }
                  slider.translationX = vf.left + sx
                  slider.translationY = vf.top + y - sh / 2f

                  val st = camera?.cameraInfo?.exposureState
                  if (st != null && st.isExposureCompensationSupported) {
                      updateExposureSlider()
                      slider.visibility = View.VISIBLE
                      slider.alpha = 1f
                  } else {
                      slider.visibility = View.GONE
                  }
                  scheduleHideFocusUi()
              }

              private fun scheduleHideFocusUi() {
                  uiHandler.removeCallbacks(hideFocusUi)
                  if (!aeLocked) uiHandler.postDelayed(hideFocusUi, 2500)
              }

              private fun updateExposureSlider() {
                  val st = camera?.cameraInfo?.exposureState ?: return
                  if (!st.isExposureCompensationSupported) return
                  val r = st.exposureCompensationRange
                  val span = (r.upper - r.lower).coerceAtLeast(1)
                  binding.exposureSlider.fraction = (exposureIndex - r.lower).toFloat() / span
              }

              /** Свайп вверх/вниз после тапа меняет яркость. */
              private fun adjustExposure(distanceY: Float) {
                  if (!aeLocked && SystemClock.uptimeMillis() - lastFocusTime > 4000) return
                  val cam = camera ?: return
                  val st = cam.cameraInfo.exposureState
                  if (!st.isExposureCompensationSupported) return

                  exposureAccum += distanceY / dp(18)
                  val steps = exposureAccum.toInt()
                  if (steps == 0) return
                  exposureAccum -= steps

                  val range = st.exposureCompensationRange
                  exposureIndex = (exposureIndex + steps).coerceIn(range.lower, range.upper)
                  cam.cameraControl.setExposureCompensationIndex(exposureIndex)
                  lastFocusTime = SystemClock.uptimeMillis()

                  updateExposureSlider()
                  if (binding.exposureSlider.visibility == View.VISIBLE) {
                      binding.exposureSlider.alpha = 1f
                      scheduleHideFocusUi()
                  }

                  val ev = exposureIndex * st.exposureCompensationStep.toFloat()
                  showHud(String.format(Locale.US, "Яркость %+.1f", ev))
              }

              // ---------------------------------------------------------------- timer / grid

              private fun cycleTimer() {
                  timerSeconds = when (timerSeconds) {
                      0 -> 3
                      3 -> 10
                      else -> 0
                  }
                  binding.btnTimer.setColorFilter(if (timerSeconds > 0) yellow else Color.WHITE)
                  saveSettings()
                  showHud(if (timerSeconds == 0) "Таймер выключен" else "Таймер: $timerSeconds с")
              }

              private fun toggleGrid() {
                  gridOn = !gridOn
                  binding.gridOverlay.visibility = if (gridOn) View.VISIBLE else View.GONE
                  binding.btnGrid.setColorFilter(if (gridOn) yellow else Color.WHITE)
                  saveSettings()
              }

              private fun startWithTimer(action: () -> Unit) {
                  if (countDown != null) {
                      cancelCountdown()
                      return
                  }
                  if (timerSeconds == 0) {
                      action()
                      return
                  }
                  binding.tvCountdown.visibility = View.VISIBLE
                  countDown = object : CountDownTimer(timerSeconds * 1000L, 1000L) {
                      override fun onTick(msLeft: Long) {
                          binding.tvCountdown.text = ((msLeft + 999) / 1000).toString()
                      }

                      override fun onFinish() {
                          countDown = null
                          binding.tvCountdown.visibility = View.GONE
                          action()
                      }
                  }.start()
              }

              private fun cancelCountdown() {
                  countDown?.cancel()
                  countDown = null
                  binding.tvCountdown.visibility = View.GONE
              }

              // ---------------------------------------------------------------- video options

              private fun cycleVideoQuality() {
                  if (recording != null || !videoMode) return
                  val cam = camera ?: return
                  val supported = try {
                      QualitySelector.getSupportedQualities(cam.cameraInfo)
                  } catch (e: Exception) {
                      emptyList()
                  }
                  val options = qualityAll.filter { it in supported }.ifEmpty { listOf(Quality.FHD) }
                  val cur = options.indexOf(videoQuality)
                  videoQuality = options[(cur + 1) % options.size]
                  saveSettings()
                  showHud("Видео: " + qualityLabel(videoQuality))
                  bindCamera()
              }

              private fun cycleFps() {
                  if (recording != null || !videoMode) return
                  fps60 = !fps60
                  saveSettings()
                  showHud(if (fps60) "60 кадров/с" else "30 кадров/с")
                  bindCamera()
              }

              private fun togglePause() {
                  val r = recording ?: return
                  if (paused) r.resume() else r.pause()
             }

              private fun recLabel(sec: Long): String =
                  String.format(Locale.US, "%s %02d:%02d", if (paused) "❚❚" else "●", sec / 60, sec % 60)

              // ---------------------------------------------------------------- photo / video mode

              private fun setMode(video: Boolean) {
                  if (recording != null || video == videoMode) return
                  val before = effRatioIndex()
                  videoMode = video
                  if (video) {
                      if (flash == FLASH_AUTO || flash == FLASH_ON) flash = FLASH_OFF
                      if (!hasAudioPermission() && !audioAsked) {
                          audioAsked = true
                          audioLauncher.launch(Manifest.permission.RECORD_AUDIO)
                      }
                  }
                  updateModeUi()
                  updateFlashUi()
                  if (before != effRatioIndex()) {
                      applyRatio(true)
                  } else {
                      applyRatio(false)
                      bindCamera()
                  }
              }

              private fun updateModeUi() {
                  binding.tvModePhoto.setTextColor(if (!videoMode) yellow else dimWhite)
                  binding.tvModeVideo.setTextColor(if (videoMode) yellow else dimWhite)
                  binding.btnCapture.setBackgroundResource(
                      if (videoMode) R.drawable.shutter_video_bg else R.drawable.shutter_button_bg
                  )
                  binding.btnCapture.contentDescription =
                      if (videoMode) "Запись видео" else "Снять фото"
              }

              private fun setRecordingUi(on: Boolean) {
                  binding.btnCapture.setBackgroundResource(
                      when {
                          on -> R.drawable.shutter_recording_bg
                          videoMode -> R.drawable.shutter_video_bg
                          else -> R.drawable.shutter_button_bg
                      }
                  )
                  paused = false
                  binding.tvRecTime.visibility = if (on) View.VISIBLE else View.GONE
                  if (on) binding.tvRecTime.text = recLabel(0)

                  // во время записи кнопка смены камеры работает как пауза
                  if (on) {
                      binding.btnSwitchCamera.setImageResource(android.R.drawable.ic_media_pause)
                      binding.btnSwitchCamera.contentDescription = "Пауза"
                  } else {
                      binding.btnSwitchCamera.setImageResource(R.drawable.ic_flip_camera)
                      binding.btnSwitchCamera.contentDescription = "Переключить камеру"
                  }

                  val a = if (on) 0.3f else 1f
                  listOf<View>(
                      binding.ivThumb,
                      binding.tvModePhoto,
                      binding.tvModeVideo,
                      binding.tvRatio,
                      binding.tvFps,
                      binding.tvExt,
                      binding.btnMirror
                  ).forEach { it.alpha = a }
              }

              private fun onShutter() {
                  if (videoMode) {
                      val rec = recording
                      if (rec != null) {
                          rec.stop()
                      } else {
                          startWithTimer { startRecording() }
                      }
                  } else {
                      startWithTimer { takePhoto() }
                  }
              }

              private fun animateShutter() {
                  binding.btnCapture.performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                  val v = binding.shutterFlash
                  v.animate().cancel()
                  v.visibility = View.VISIBLE
                  v.alpha = 0.7f
                  v.animate()
                      .alpha(0f)
                      .setDuration(180)
                      .withEndAction { v.visibility = View.GONE }
                      .start()
              }

              // ---------------------------------------------------------------- photo

              private fun takePhoto() {
                  val capture = imageCapture ?: return
                  if (screenFlashWanted()) {
                      showScreenFlash(true)
                      binding.root.postDelayed({
                          if (!isDestroyed) doCapture(capture)
                      }, 350)
                  } else {
                      doCapture(capture)
                  }
              }

              private fun doCapture(capture: ImageCapture) {
                  animateShutter()

                  val name = "IMG_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                  val values = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg")
                      if (Build.VERSION.SDK_INT > Build.VERSION_CODES.P) {
                          put(MediaStore.MediaColumns.RELATIVE_PATH, "DCIM/Camera")
                      }
                  }

                  val metadata = ImageCapture.Metadata().apply {
                      isReversedHorizontal =
                          lensFacing == CameraSelector.LENS_FACING_FRONT && mirrorSelfie
                  }

                  val options = ImageCapture.OutputFileOptions.Builder(
                      contentResolver,
                      MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                      values
                  ).setMetadata(metadata).build()

                  capture.takePicture(
                      options,
                      ContextCompat.getMainExecutor(this),
                      object : ImageCapture.OnImageSavedCallback {
                          override fun onImageSaved(output: ImageCapture.OutputFileResults) {
                              showScreenFlash(false)
                              output.savedUri?.let { showThumb(it, false) }
                          }

                          override fun onError(exc: ImageCaptureException) {
                              showScreenFlash(false)
                              Toast.makeText(this@MainActivity, "Ошибка съёмки", Toast.LENGTH_SHORT).show()
                          }
                      }
                  )
              }

              // ---------------------------------------------------------------- video

              @SuppressLint("MissingPermission")
              private fun startRecording() {
                  val vc = videoCapture ?: return

                  val name = "VID_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                  val values = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      put(MediaStore.MediaColumns.MIME_TYPE, "video/mp4")
                      if (Build.VERSION.SDK_INT > Build.VERSION_CODES.P) {
                          put(MediaStore.MediaColumns.RELATIVE_PATH, "DCIM/Camera")
                      }
                  }
                  val options = MediaStoreOutputOptions.Builder(
                      contentResolver,
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  ).setContentValues(values).build()

                  var pending = vc.output.prepareRecording(this, options)
                  if (hasAudioPermission()) {
                      pending = pending.withAudioEnabled()
                  }

                  recSeconds = 0L
                  recording = pending.start(ContextCompat.getMainExecutor(this)) { event ->
                      when (event) {
                          is VideoRecordEvent.Start -> setRecordingUi(true)
                          is VideoRecordEvent.Status -> {
                              recSeconds = event.recordingStats.recordedDurationNanos / 1_000_000_000L
                              binding.tvRecTime.text = recLabel(recSeconds)
                          }
                          is VideoRecordEvent.Pause -> {
                              paused = true
                              binding.btnSwitchCamera.setImageResource(android.R.drawable.ic_media_play)
                              binding.btnSwitchCamera.contentDescription = "Продолжить"
                              binding.tvRecTime.text = recLabel(recSeconds)
                          }
                          is VideoRecordEvent.Resume -> {
                              paused = false
                              binding.btnSwitchCamera.setImageResource(android.R.drawable.ic_media_pause)
                              binding.btnSwitchCamera.contentDescription = "Пауза"
                              binding.tvRecTime.text = recLabel(recSeconds)
                          }
                          is VideoRecordEvent.Finalize -> {
                              recording = null
                              setRecordingUi(false)
                              if (!event.hasError()) {
                                  showThumb(event.outputResults.outputUri, true)
                                  toast("Видео сохранено")
                              } else {
                                  toast("Ошибка записи видео")
                              }
                          }
                          else -> {}
                      }
                  }
              }

              // ---------------------------------------------------------------- thumbnail / gallery

              private fun showThumb(uri: Uri, isVideo: Boolean) {
                  lastUri = uri
                  lastIsVideo = isVideo
                  Thread {
                      val bmp = try {
                          if (isVideo) videoThumb(uri) else photoThumb(uri)
                      } catch (e: Exception) {
                          null
                      }
                      runOnUiThread {
                          if (bmp != null && !isDestroyed && lastUri == uri) {
                              binding.ivThumb.setImageBitmap(bmp)
                          }
                      }
                  }.start()
              }

              private fun photoThumb(uri: Uri): Bitmap? {
                  val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  contentResolver.openInputStream(uri)?.use {
                      BitmapFactory.decodeStream(it, null, bounds)
                  }
                  var sample = 1
                  val minSide = minOf(bounds.outWidth, bounds.outHeight)
                  while (minSide / (sample * 2) >= 300) sample *= 2

                  val opts = BitmapFactory.Options().apply { inSampleSize = sample }
                  val bmp = contentResolver.openInputStream(uri)?.use {
                      BitmapFactory.decodeStream(it, null, opts)
                  } ?: return null

                  val rotation = contentResolver.openInputStream(uri)?.use {
                      when (
                          ExifInterface(it).getAttributeInt(
                              ExifInterface.TAG_ORIENTATION,
                              ExifInterface.ORIENTATION_NORMAL
                          )
                      ) {
                          ExifInterface.ORIENTATION_ROTATE_90 -> 90
                          ExifInterface.ORIENTATION_ROTATE_180 -> 180
                          ExifInterface.ORIENTATION_ROTATE_270 -> 270
                          else -> 0
                      }
                  } ?: 0

                  if (rotation == 0) return bmp
                  val m = Matrix().apply { postRotate(rotation.toFloat()) }
                  return Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true)
              }

              private fun videoThumb(uri: Uri): Bitmap? {
                  val r = MediaMetadataRetriever()
                  return try {
                      r.setDataSource(this, uri)
                      r.getFrameAtTime(0)
                  } finally {
                      r.release()
                  }
              }

              /** При запуске показываем последний снимок, сделанный этим приложением. */
              private fun loadLastMedia() {
                  Thread {
                      var bestUri: Uri? = null
                      var bestTime = -1L
                      var bestVideo = false
                      val sources = listOf(
                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI to false,
                          MediaStore.Video.Media.EXTERNAL_CONTENT_URI to true
                      )
                      for ((base, isVideo) in sources) {
                          try {
                              contentResolver.query(
                                  base,
                                  arrayOf(MediaStore.MediaColumns._ID, MediaStore.MediaColumns.DATE_ADDED),
                                  null,
                                  null,
                                  MediaStore.MediaColumns.DATE_ADDED + " DESC"
                              )?.use { c ->
                                  if (c.moveToFirst()) {
                                      val t = c.getLong(1)
                                      if (t > bestTime) {
                                          bestTime = t
                                          bestUri = ContentUris.withAppendedId(base, c.getLong(0))
                                          bestVideo = isVideo
                                      }
                                  }
                              }
                          } catch (e: Exception) {
                              // нет доступа или пусто, просто пропускаем
                          }
                      }
                      val uri = bestUri ?: return@Thread
                      val video = bestVideo
                      runOnUiThread { if (lastUri == null) showThumb(uri, video) }
                  }.start()
              }

              private fun openLastMedia() {
                  if (recording != null) return
                  val uri = lastUri
                  if (uri == null) {
                      toast("Пока нет снимков")
                      return
                  }
                  val intent = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, if (lastIsVideo) "video/*" else "image/*")
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  try {
                      startActivity(intent)
                  } catch (e: Exception) {
                      toast("Не нашлось приложения для просмотра")
                  }
              }
          }
          EOF_FILE

      - name: Install build tools
        run: |
          if [ -n "$JAVA_HOME_17_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
            echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          fi
          curl -fsSL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o gradle.zip
          unzip -q gradle.zip
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Build APK
        run: ./gradle-8.2/bin/gradle assembleDebug --no-daemon

      - name: Publish APK for download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk camera.apk
          gh release delete camera-apk --yes --cleanup-tag || true
          gh release create camera-apk camera.apk --target "$GITHUB_SHA" --title "Камера (APK)" --notes "Скачайте camera.apk и установите на телефон"

      - uses: actions/upload-artifact@v6
        with:
          name: camera-apk
          path: app/build/outputs/apk/debug/app-debug.apk
