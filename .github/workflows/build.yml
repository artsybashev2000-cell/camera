name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/example/simplecamera app/src/main/res/layout app/src/main/res/drawable
          cat > settings.gradle << 'EOF_FILE'
          rootProject.name = "SimpleCamera"
          include ':app'
          EOF_FILE
          cat > build.gradle << 'EOF_FILE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF_FILE
          cat > gradle.properties << 'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF_FILE
          cat > app/build.gradle << 'EOF_FILE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.simplecamera'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.simplecamera"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

              def camerax = "1.3.1"
              implementation "androidx.camera:camera-core:$camerax"
              implementation "androidx.camera:camera-camera2:$camerax"
              implementation "androidx.camera:camera-lifecycle:$camerax"
              implementation "androidx.camera:camera-video:$camerax"
              implementation "androidx.camera:camera-view:$camerax"
              implementation "androidx.camera:camera-extensions:$camerax"
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <uses-feature android:name="android.hardware.camera.any" />
              <uses-feature
                  android:name="android.hardware.microphone"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Камера"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          EOF_FILE
          cat > app/src/main/res/layout/activity_main.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <androidx.camera.view.PreviewView
                  android:id="@+id/viewFinder"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />

              <View
                  android:id="@+id/screenFlash"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:background="#FFFFFF"
                  android:visibility="gone"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />

              <com.example.simplecamera.GridOverlayView
                  android:id="@+id/gridOverlay"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:visibility="gone"
                  app:layout_constraintBottom_toBottomOf="@id/viewFinder"
                  app:layout_constraintEnd_toEndOf="@id/viewFinder"
                  app:layout_constraintStart_toStartOf="@id/viewFinder"
                  app:layout_constraintTop_toTopOf="@id/viewFinder" />

              <View
                  android:id="@+id/focusRing"
                  android:layout_width="72dp"
                  android:layout_height="72dp"
                  android:background="@drawable/focus_ring"
                  android:visibility="gone"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />

              <com.example.simplecamera.ExposureSliderView
                  android:id="@+id/exposureSlider"
                  android:layout_width="28dp"
                  android:layout_height="120dp"
                  android:visibility="gone"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />

              <LinearLayout
                  android:id="@+id/topBar"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:background="@drawable/top_gradient"
                  android:clickable="true"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="8dp"
                  android:paddingTop="8dp"
                  android:paddingEnd="8dp"
                  android:paddingBottom="20dp"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent">

                  <ImageButton
                      android:id="@+id/btnFlash"
                      android:layout_width="0dp"
                      android:layout_height="48dp"
                      android:layout_weight="1"
                      android:background="?android:attr/selectableItemBackgroundBorderless"
                      android:contentDescription="Вспышка"
                      android:scaleType="centerInside"
                      android:src="@drawable/ic_flash_off" />

                  <ImageButton
                      android:id="@+id/btnTimer"
                      android:layout_width="0dp"
                      android:layout_height="48dp"
                      android:layout_weight="1"
                      android:background="?android:attr/selectableItemBackgroundBorderless"
                      android:contentDescription="Таймер"
                      android:scaleType="centerInside"
                      android:src="@drawable/ic_timer" />

                  <TextView
                      android:id="@+id/tvRatio"
                      android:layout_width="0dp"
                      android:layout_height="48dp"
                      android:layout_weight="1"
                      android:background="?android:attr/selectableItemBackgroundBorderless"
                      android:gravity="center"
                      android:text="4:3"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/tvFps"
                      android:layout_width="0dp"
                      android:layout_height="48dp"
                      android:layout_weight="1"
                      android:background="?android:attr/selectableItemBackgroundBorderless"
                      android:gravity="center"
                      android:text="30fps"
                      android:textColor="#FFFFFF"
                      android:textSize="13sp"
                      android:textStyle="bold"
                      android:visibility="gone" />

                  <TextView
                      android:id="@+id/tvExt"
                      android:layout_width="0dp"
                      android:layout_height="48dp"
                      android:layout_weight="1"
                      android:background="?android:attr/selectableItemBackgroundBorderless"
                      android:gravity="center"
                      android:text="HDR"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"
                      android:textStyle="bold"
                      android:visibility="gone" />

                  <ImageButton
                      android:id="@+id/btnMirror"
                      android:layout_width="0dp"
                      android:layout_height="48dp"
                      android:layout_weight="1"
                      android:background="?android:attr/selectableItemBackgroundBorderless"
                      android:contentDescription="Зеркало"
                      android:scaleType="centerInside"
                      android:src="@drawable/ic_mirror"
                      android:visibility="gone" />

                  <ImageButton
                      android:id="@+id/btnGrid"
                      android:layout_width="0dp"
                      android:layout_height="48dp"
                      android:layout_weight="1"
                      android:background="?android:attr/selectableItemBackgroundBorderless"
                      android:contentDescription="Сетка"
                      android:scaleType="centerInside"
                      android:src="@drawable/ic_grid" />

              </LinearLayout>

              <TextView
                  android:id="@+id/tvRecTime"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:background="@drawable/rec_bg"
                  android:paddingStart="14dp"
                  android:paddingTop="6dp"
                  android:paddingEnd="14dp"
                  android:paddingBottom="6dp"
                  android:text="● 00:00"
                  android:textColor="#FFFFFF"
                  android:textSize="14sp"
                  android:textStyle="bold"
                  android:visibility="gone"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toBottomOf="@id/topBar" />

              <TextView
                  android:id="@+id/tvHud"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:background="@drawable/pill_bg"
                  android:paddingStart="16dp"
                  android:paddingTop="8dp"
                  android:paddingEnd="16dp"
                  android:paddingBottom="8dp"
                  android:textColor="#FFFFFF"
                  android:textSize="14sp"
                  android:visibility="gone"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintVertical_bias="0.2" />

              <TextView
                  android:id="@+id/tvCountdown"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:shadowColor="#80000000"
                  android:shadowDx="0"
                  android:shadowDy="4"
                  android:shadowRadius="12"
                  android:textColor="#FFFFFF"
                  android:textSize="120sp"
                  android:textStyle="bold"
                  android:visibility="gone"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />

              <LinearLayout
                  android:id="@+id/bottomBar"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:background="@drawable/bottom_gradient"
                  android:clickable="true"
                  android:gravity="center_horizontal"
                  android:orientation="vertical"
                  android:paddingTop="28dp"
                  android:paddingBottom="12dp"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent">

                  <LinearLayout
                      android:id="@+id/zoomRow"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:background="@drawable/pill_bg"
                      android:gravity="center_vertical"
                      android:orientation="horizontal"
                      android:padding="4dp" />

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="10dp"
                      android:orientation="horizontal">

                      <TextView
                          android:id="@+id/tvModePhoto"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:paddingStart="16dp"
                          android:paddingTop="8dp"
                          android:paddingEnd="16dp"
                          android:paddingBottom="8dp"
                          android:text="ФОТО"
                          android:textColor="#FFD400"
                          android:textSize="14sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/tvModeVideo"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:paddingStart="16dp"
                          android:paddingTop="8dp"
                          android:paddingEnd="16dp"
                          android:paddingBottom="8dp"
                          android:text="ВИДЕО"
                          android:textColor="#99FFFFFF"
                          android:textSize="14sp"
                          android:textStyle="bold" />

                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="10dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <FrameLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1">

                          <ImageView
                              android:id="@+id/ivThumb"
                              android:layout_width="52dp"
                              android:layout_height="52dp"
                              android:layout_gravity="center"
                              android:background="@drawable/thumb_bg"
                              android:contentDescription="Последний снимок"
                              android:padding="2dp"
                              android:scaleType="centerCrop" />

                      </FrameLayout>

                      <FrameLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1">

                          <ImageButton
                              android:id="@+id/btnCapture"
                              android:layout_width="76dp"
                              android:layout_height="76dp"
                              android:layout_gravity="center"
                              android:background="@drawable/shutter_button_bg"
                              android:contentDescription="Снять фото" />

                      </FrameLayout>

                      <FrameLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1">

                          <ImageButton
                              android:id="@+id/btnSwitchCamera"
                              android:layout_width="56dp"
                              android:layout_height="56dp"
                              android:layout_gravity="center"
                              android:background="@android:color/transparent"
                              android:contentDescription="Переключить камеру"
                              android:src="@drawable/ic_flip_camera"
                              android:tint="#FFFFFF" />

                      </FrameLayout>

                  </LinearLayout>

              </LinearLayout>

              <View
                  android:id="@+id/shutterFlash"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:background="#FFFFFF"
                  android:visibility="gone"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />

          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF_FILE
          cat > app/src/main/res/drawable/shutter_button_bg.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="oval">
                      <stroke android:width="4dp" android:color="#FFFFFF" />
                      <solid android:color="#00000000" />
                  </shape>
              </item>
              <item
                  android:left="9dp"
                  android:top="9dp"
                  android:right="9dp"
                  android:bottom="9dp">
                  <shape android:shape="oval">
                      <solid android:color="#FFFFFF" />
                  </shape>
              </item>
          </layer-list>
          EOF_FILE
          cat > app/src/main/res/drawable/shutter_video_bg.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="oval">
                      <stroke android:width="4dp" android:color="#FFFFFF" />
                      <solid android:color="#00000000" />
                  </shape>
              </item>
              <item
                  android:left="9dp"
                  android:top="9dp"
                  android:right="9dp"
                  android:bottom="9dp">
                  <shape android:shape="oval">
                      <solid android:color="#E53935" />
                  </shape>
              </item>
          </layer-list>
          EOF_FILE
          cat > app/src/main/res/drawable/shutter_recording_bg.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="oval">
                      <stroke android:width="4dp" android:color="#FFFFFF" />
                      <solid android:color="#00000000" />
                  </shape>
              </item>
              <item
                  android:left="24dp"
                  android:top="24dp"
                  android:right="24dp"
                  android:bottom="24dp">
                  <shape android:shape="rectangle">
                      <corners android:radius="6dp" />
                      <solid android:color="#E53935" />
                  </shape>
              </item>
          </layer-list>
          EOF_FILE
          cat > app/src/main/res/drawable/top_gradient.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="90"
                  android:endColor="#99000000"
                  android:startColor="#00000000" />
          </shape>
          EOF_FILE
          cat > app/src/main/res/drawable/bottom_gradient.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="270"
                  android:endColor="#B3000000"
                  android:startColor="#00000000" />
          </shape>
          EOF_FILE
          cat > app/src/main/res/drawable/pill_bg.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#80000000" />
              <corners android:radius="20dp" />
          </shape>
          EOF_FILE
          cat > app/src/main/res/drawable/chip_sel_bg.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#40FFFFFF" />
              <corners android:radius="16dp" />
          </shape>
          EOF_FILE
          cat > app/src/main/res/drawable/rec_bg.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#E53935" />
              <corners android:radius="20dp" />
          </shape>
          EOF_FILE
          cat > app/src/main/res/drawable/focus_ring.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <stroke
                  android:width="2dp"
                  android:color="#FFD400" />
              <corners android:radius="6dp" />
          </shape>
          EOF_FILE
          cat > app/src/main/res/drawable/thumb_bg.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#33FFFFFF" />
              <stroke
                  android:width="2dp"
                  android:color="#FFFFFF" />
          </shape>
          EOF_FILE
          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path
                  android:fillColor="#1E1E1E"
                  android:pathData="M20,0h56a20,20 0 0 1 20,20v56a20,20 0 0 1 -20,20h-56a20,20 0 0 1 -20,-20v-56a20,20 0 0 1 20,-20z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M22,48a26,26 0 1,0 52,0a26,26 0 1,0 -52,0" />
              <path
                  android:fillColor="#1E1E1E"
                  android:pathData="M30,48a18,18 0 1,0 36,0a18,18 0 1,0 -36,0" />
              <path
                  android:fillColor="#FFD400"
                  android:pathData="M40,48a8,8 0 1,0 16,0a8,8 0 1,0 -16,0" />
          </vector>
          EOF_FILE
          cat > app/src/main/res/drawable/ic_flip_camera.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="28dp"
              android:height="28dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="2"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M20,12a8,8 0 1,1 -2.34,-5.66 M20,4v4h-4" />
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="1.6"
                  android:strokeLineJoin="round"
                  android:pathData="M9,10h6v4h-6z" />
          </vector>
          EOF_FILE
          cat > app/src/main/res/drawable/ic_mirror.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="28dp"
              android:height="28dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="2"
                  android:strokeLineCap="round"
                  android:pathData="M12,3v3 M12,9v3 M12,15v3 M12,20v1" />
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="1.8"
                  android:strokeLineJoin="round"
                  android:pathData="M9,7L3,17h6z" />
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="1.8"
                  android:strokeLineJoin="round"
                  android:pathData="M15,7l6,10h-6z" />
          </vector>
          EOF_FILE
          cat > app/src/main/res/drawable/ic_flash_on.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="28dp"
              android:height="28dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M7,2v11h3v9l7,-12h-4l4,-8z" />
          </vector>
          EOF_FILE
          cat > app/src/main/res/drawable/ic_flash_off.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="28dp"
              android:height="28dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="1.6"
                  android:strokeLineJoin="round"
                  android:pathData="M7,2v11h3v9l7,-12h-4l4,-8z" />
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="2"
                  android:strokeLineCap="round"
                  android:pathData="M4,3L20,21" />
          </vector>
          EOF_FILE
          cat > app/src/main/res/drawable/ic_flash_auto.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="28dp"
              android:height="28dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <group
                  android:pivotX="12"
                  android:pivotY="12"
                  android:scaleX="0.85"
                  android:scaleY="0.85"
                  android:translateX="-2">
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M7,2v11h3v9l7,-12h-4l4,-8z" />
              </group>
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="2"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M15,21L18,12L21,21 M16.2,18L19.8,18" />
          </vector>
          EOF_FILE
          cat > app/src/main/res/drawable/ic_flash_torch.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="28dp"
              android:height="28dp"
              android:viewportWidth="24"
