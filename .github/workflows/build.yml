name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/example/simplecamera app/src/main/res/layout app/src/main/res/drawable
          cat > settings.gradle << 'EOF_FILE'
          rootProject.name = "SimpleCamera"
          include ':app'
          EOF_FILE
          cat > build.gradle << 'EOF_FILE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF_FILE
          cat > gradle.properties << 'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF_FILE
          cat > app/build.gradle << 'EOF_FILE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.simplecamera'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.simplecamera"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'

              def camerax = "1.3.1"
              implementation "androidx.camera:camera-core:$camerax"
              implementation "androidx.camera:camera-camera2:$camerax"
              implementation "androidx.camera:camera-lifecycle:$camerax"
              implementation "androidx.camera:camera-view:$camerax"
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <uses-feature android:name="android.hardware.camera.any" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_camera"
                  android:label="Камера"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          EOF_FILE
          cat > app/src/main/res/layout/activity_main.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000"
              android:orientation="vertical">

              <androidx.camera.view.PreviewView
                  android:id="@+id/viewFinder"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="130dp"
                  android:background="#111111"
                  android:gravity="center"
                  android:orientation="horizontal">

                  <ImageButton
                      android:id="@+id/btnSwitchCamera"
                      android:layout_width="56dp"
                      android:layout_height="56dp"
                      android:background="@android:color/transparent"
                      android:contentDescription="Переключить камеру"
                      android:src="@android:drawable/ic_menu_rotate"
                      android:tint="#FFFFFF" />

                  <ImageButton
                      android:id="@+id/btnCapture"
                      android:layout_width="76dp"
                      android:layout_height="76dp"
                      android:layout_marginStart="40dp"
                      android:layout_marginEnd="40dp"
                      android:background="@drawable/shutter_button_bg"
                      android:contentDescription="Снять фото" />

                  <View
                      android:layout_width="56dp"
                      android:layout_height="56dp" />

              </LinearLayout>

          </LinearLayout>
          EOF_FILE
          cat > app/src/main/res/drawable/shutter_button_bg.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="oval">
                      <stroke android:width="4dp" android:color="#FFFFFF" />
                      <solid android:color="#00000000" />
                  </shape>
              </item>
              <item
                  android:left="9dp"
                  android:top="9dp"
                  android:right="9dp"
                  android:bottom="9dp">
                  <shape android:shape="oval">
                      <solid android:color="#FFFFFF" />
                  </shape>
              </item>
          </layer-list>
          EOF_FILE
          cat > app/src/main/java/com/example/simplecamera/MainActivity.kt << 'EOF_FILE'
          package com.example.simplecamera

          import android.Manifest
          import android.content.ContentValues
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ImageCapture
          import androidx.camera.core.ImageCaptureException
          import androidx.camera.core.Preview
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import com.example.simplecamera.databinding.ActivityMainBinding
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private var cameraProvider: ProcessCameraProvider? = null
              private var imageCapture: ImageCapture? = null
              private var lensFacing = CameraSelector.LENS_FACING_BACK

              private val neededPermissions: Array<String> =
                  if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.P) {
                      arrayOf(Manifest.permission.CAMERA, Manifest.permission.WRITE_EXTERNAL_STORAGE)
                  } else {
                      arrayOf(Manifest.permission.CAMERA)
                  }

              private val permissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                      if (allPermissionsGranted()) {
                          startCamera()
                      } else {
                          Toast.makeText(this, "Нужно разрешение на камеру", Toast.LENGTH_LONG).show()
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  binding.viewFinder.scaleType = PreviewView.ScaleType.FIT_CENTER
                  binding.btnCapture.setOnClickListener { takePhoto() }
                  binding.btnSwitchCamera.setOnClickListener { switchCamera() }

                  if (allPermissionsGranted()) {
                      startCamera()
                  } else {
                      permissionLauncher.launch(neededPermissions)
                  }
              }

              private fun allPermissionsGranted(): Boolean = neededPermissions.all {
                  ContextCompat.checkSelfPermission(this, it) == PackageManager.PERMISSION_GRANTED
              }

              private fun selectorFor(facing: Int): CameraSelector =
                  CameraSelector.Builder().requireLensFacing(facing).build()

              private fun hasLens(provider: ProcessCameraProvider, facing: Int): Boolean =
                  try {
                      provider.hasCamera(selectorFor(facing))
                  } catch (e: Exception) {
                      false
                  }

              private fun startCamera() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      val provider = future.get()
                      cameraProvider = provider
                      if (!hasLens(provider, lensFacing)) {
                          lensFacing = CameraSelector.LENS_FACING_FRONT
                      }
                      bindCamera()
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun bindCamera() {
                  val provider = cameraProvider ?: return

                  val preview = Preview.Builder().build()
                  preview.setSurfaceProvider(binding.viewFinder.surfaceProvider)

                  val capture = ImageCapture.Builder()
                      .setCaptureMode(ImageCapture.CAPTURE_MODE_MINIMIZE_LATENCY)
                      .build()
                  imageCapture = capture

                  try {
                      provider.unbindAll()
                      provider.bindToLifecycle(this, selectorFor(lensFacing), preview, capture)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Не удалось запустить камеру", Toast.LENGTH_LONG).show()
                  }
              }

              private fun switchCamera() {
                  val provider = cameraProvider ?: return
                  val newFacing = if (lensFacing == CameraSelector.LENS_FACING_BACK) {
                      CameraSelector.LENS_FACING_FRONT
                  } else {
                      CameraSelector.LENS_FACING_BACK
                  }
                  if (hasLens(provider, newFacing)) {
                      lensFacing = newFacing
                      bindCamera()
                  } else {
                      Toast.makeText(this, "Другой камеры нет", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun takePhoto() {
                  val capture = imageCapture ?: return

                  val name = "IMG_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                  val values = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg")
                      if (Build.VERSION.SDK_INT > Build.VERSION_CODES.P) {
                          put(MediaStore.MediaColumns.RELATIVE_PATH, "DCIM/Camera")
                      }
                  }

                  val options = ImageCapture.OutputFileOptions.Builder(
                      contentResolver,
                      MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                      values
                  ).build()

                  capture.takePicture(
                      options,
                      ContextCompat.getMainExecutor(this),
                      object : ImageCapture.OnImageSavedCallback {
                          override fun onImageSaved(output: ImageCapture.OutputFileResults) {
                              Toast.makeText(this@MainActivity, "Фото сохранено", Toast.LENGTH_SHORT).show()
                          }

                          override fun onError(exc: ImageCaptureException) {
                              Toast.makeText(this@MainActivity, "Ошибка съёмки", Toast.LENGTH_SHORT).show()
                          }
                      }
                  )
              }
          }
          EOF_FILE

      - name: Install build tools
        run: |
          if [ -n "$JAVA_HOME_17_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
            echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          fi
          curl -fsSL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o gradle.zip
          unzip -q gradle.zip
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Build APK
        run: ./gradle-8.2/bin/gradle assembleDebug --no-daemon

      - name: Publish APK for download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk camera.apk
          gh release delete camera-apk --yes --cleanup-tag || true
          gh release create camera-apk camera.apk --target "$GITHUB_SHA" --title "Камера (APK)" --notes "Скачайте camera.apk и установите на телефон"

      - uses: actions/upload-artifact@v6
        with:
          name: camera-apk
          path: app/build/outputs/apk/debug/app-debug.apk
