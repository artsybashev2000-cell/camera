name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/example/simplecamera app/src/main/res/layout app/src/main/res/drawable
          cat > settings.gradle << 'EOF_FILE'
          rootProject.name = "SimpleCamera"
          include ':app'
          EOF_FILE
          cat > build.gradle << 'EOF_FILE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF_FILE
          cat > gradle.properties << 'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF_FILE
          cat > app/build.gradle << 'EOF_FILE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.simplecamera'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.simplecamera"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

              def camerax = "1.3.1"
              implementation "androidx.camera:camera-core:$camerax"
              implementation "androidx.camera:camera-camera2:$camerax"
              implementation "androidx.camera:camera-lifecycle:$camerax"
              implementation "androidx.camera:camera-video:$camerax"
              implementation "androidx.camera:camera-view:$camerax"
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <uses-feature android:name="android.hardware.camera.any" />
              <uses-feature
                  android:name="android.hardware.microphone"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_camera"
                  android:label="Камера"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          EOF_FILE
          cat > app/src/main/res/layout/activity_main.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <androidx.camera.view.PreviewView
                  android:id="@+id/viewFinder"
